<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Juice Shop — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" aria-labelledby="title">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🍊</span>
      <span class="brand-name">Juice&nbsp;Shop</span>
    </div>

    <h1 id="title">Log in to your account</h1>
    <p class="subtitle">Squeeze in. Fresh carts waiting.</p>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="text"
        inputmode="email"
        autocomplete="username"
        placeholder="you@juice-sh.op"
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="At least 8 characters"
      />

      <p id="clientError" class="error" role="alert"></p>

      <button type="submit">Log in</button>
    </form>

    <div id="result" class="result" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
